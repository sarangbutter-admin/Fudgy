# Netlify settings for the CUSTOMER shop. No build step: the site is plain files.
# (The team/admin site is a second Netlify site with Base directory "admin-site"; it uses admin-site/netlify.toml.)
[build]
  publish = "site"
  command = ""
  # Cost control (exit 0 = skip the build):
  #  - ONLY the "dev" branch is ever built. main and every other branch are skipped.
#    (Building main needs the owner's approval: change this rule only when they say so.)
  #  - skip when a push didn't change the shop files (e.g. only the admin site changed)
  ignore = "test \"$BRANCH\" != \"dev\" || ( test -n \"$CACHED_COMMIT_REF\" && test \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- site netlify.toml )"

# Pull-request previews are off unless you turn them on in Netlify.
# Production deploys cost credits (15 each), so they are NEVER built automatically,
# whatever branch is set as production. Only the free "dev" branch deploy builds.
[context.production]
  ignore = "exit 0"

# Security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' data: https://*.supabase.co; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# The page itself must always be fresh so updates show straight away
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"
